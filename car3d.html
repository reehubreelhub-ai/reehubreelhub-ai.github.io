<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050c">
<title>ReelHub 3D Racer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff2e63'/><text x='50' y='55' font-size='60' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle' dominant-baseline='middle'>R</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05050c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:none}
#gameCanvas{display:block;width:100vw;height:100vh;position:fixed;top:0;left:0}

#orientationOverlay{position:fixed;inset:0;background:linear-gradient(135deg,#0a0a1a,#1a0a20);z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:30px;text-align:center}
#orientationOverlay.show{display:flex}
.rotate-phone{width:74px;height:130px;border:4px solid #ff2e63;border-radius:14px;position:relative;animation:rotateHint 2s ease-in-out infinite;background:#0a0a1a}
.rotate-phone::after{content:'';position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:28px;height:3px;background:#ff2e63;border-radius:2px}
@keyframes rotateHint{0%,100%{transform:rotate(0)}40%{transform:rotate(-90deg)}60%{transform:rotate(-90deg)}}
#orientationOverlay h2{font-size:22px;font-weight:900;background:linear-gradient(90deg,#ff2e63,#ff8a00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#orientationOverlay p{font-size:13px;color:#888;max-width:300px;line-height:1.6}

#loading{position:fixed;inset:0;background:#05050c;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .4s}
#loading.hide{opacity:0;pointer-events:none}
.spinner{width:52px;height:52px;border:3px solid #16161f;border-top-color:#ff2e63;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingText{font-size:12px;color:#777;font-weight:800;letter-spacing:2px;text-transform:uppercase}

#carPicker{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#1b0f22 0%,#05050c 70%);z-index:9000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#carPicker.show{display:flex}
#carPicker h1{font-size:24px;font-weight:900;background:linear-gradient(90deg,#ff2e63,#ff8a00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;text-align:center;letter-spacing:.5px}
#carPicker .subtitle{font-size:11px;color:#7a7a90;margin-bottom:18px;text-align:center;letter-spacing:1.2px;text-transform:uppercase}
.car-options{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;max-width:960px}
.car-card{background:linear-gradient(160deg,#14141f,#0a0a12);border:2px solid #22222f;border-radius:18px;padding:14px;width:216px;cursor:pointer;transition:all .22s cubic-bezier(.3,1.4,.5,1);position:relative}
.car-card:hover{border-color:#ff2e63;transform:translateY(-4px)}
.car-card.selected{border-color:#ff2e63;box-shadow:0 0 34px rgba(255,46,99,.35)}
.car-preview{height:96px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;color:#1e4fd8}
.car-preview svg{max-width:100%;max-height:100%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
.car-name{font-size:15px;
