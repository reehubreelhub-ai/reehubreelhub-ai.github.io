<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>ReelHub Admin</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    /* Fallback styles agar admin.css load na ho */
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: sans-serif; }
    #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .spinner { width: 40px; height: 40px; border: 4px solid #333; border-top-color: #ff2e63; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #adminLogin { display: none; align-items: center; justify-content: center; height: 100vh; }
  </style>
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer" style="position:fixed; top:20px; right:20px; z-index:99999; display:flex; flex-direction:column; gap:10px;"></div>

  <!-- LOADER -->
  <div class="loader-screen" id="loader">
    <div class="spinner"></div>
    <div style="color:#888;font-size:13px; margin-top:10px;">Checking access...</div>
  </div>

  <!-- LOGIN -->
  <div id="adminLogin" style="display:none;">
    <div class="login-box" style="background:#121218; padding:30px; border-radius:12px; width:300px;">
      <div class="login-logo" style="font-size:24px; font-weight:bold; color:#ff2e63; text-align:center;">ReelHub</div>
      <div class="login-sub" style="text-align:center; color:#888; margin-bottom:20px;">Admin Panel</div>
      <div class="login-title" style="margin-bottom:15px; text-align:center;">Sign in</div>
      
      <div class="input-group" style="margin-bottom:15px;">
        <label style="display:block; font-size:12px; color:#888; margin-bottom:5px;">Email</label>
        <input type="email" id="adminEmail" placeholder="admin@reelhub.com" style="width:100%; padding:10px; background:#0a0a12; border:1px solid #333; color:#fff; border-radius:8px; box-sizing:border-box;">
      </div>
      
      <div class="input-group" style="margin-bottom:15px;">
        <label style="display:block; font-size:12px; color:#888; margin-bottom:5px;">Password</label>
        <input type="password" id="adminPass" placeholder="••••••" style="width:100%; padding:10px; background:#0a0a12; border:1px solid #333; color:#fff; border-radius:8px; box-sizing:border-box;">
      </div>
      
      <button class="btn-primary" id="adminLoginBtn" style="width:100%; padding:12px; background:#ff2e63; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Log In</button>
      <div class="error-msg" id="adminLoginMsg" style="color:#ff4d4d; font-size:12px; text-align:center; margin-top:10px;"></div>
    </div>
  </div>

  <!-- ADMIN APP -->
  <div id="adminApp" style="display:none;">
    <header class="admin-header" style="display:flex; justify-content:space-between; padding:15px; background:#121218; border-bottom:1px solid #333;">
      <div class="logo" style="font-weight:bold; color:#fff;">ReelHub <span class="badge" style="background:#ff2e63; color:#fff; padding:2px 6px; border-radius:4px; font-size:10px;">ADMIN</span></div>
      <div class="user-info" style="display:flex; gap:10px; align-items:center;">
        <span id="adminName" style="font-size:14px;">Admin</span>
        <button id="adminLogout" style="background:#ff4d4d; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">Logout</button>
      </div>
    </header>

    <div class="admin-body" style="display:flex; min-height:calc(100vh - 60px);">
      
      <!-- SIDEBAR -->
      <aside class="admin-sidebar" style="width:200px; background:#121218; padding:15px; border-right:1px solid #333; display:flex; flex-direction:column; gap:10px;">
        
        <button class="side-item active" data-page="dashboard" style="background:none; border:none; color:#fff; text-align:left; padding:10px; cursor:pointer;">Dashboard</button>
        <button class="side-item" data-page="users" style="background:none; border:none; color:#fff; text-align:left; padding:10px; cursor:pointer;">Users</button>
        <button class="side-item" data-page="videos" style="background:none; border:none; color:#fff; text-align:left; padding:10px; cursor:pointer;">Videos</button>
        <button class="side-item" data-page="comments" style="background:none; border:none; color:#fff; text-align:left; padding:10px; cursor:pointer;">Comments</button>
        <button class="side-item" data-page="payments" style="background:none; border:none; color:#fff; text-align:left; padding:10px; cursor:pointer;">Payments</button>
        
        <!-- ✅ NAYA: WALLET BUTTON -->
        <button class="side-item" data-page="wallet" style="background:none; border:none; color:#fff; text-align:left; padding:10px; cursor:pointer;">Wallet</button>
        
        <button class="side-item" data-page="admins" style="background:none; border:none; color:#fff; text-align:left; padding:10px; cursor:pointer;">Admins</button>
        <button class="side-item" data-page="notifications" style="background:none; border:none; color:#fff; text-align:left; padding:10px; cursor:pointer;">Notify</button>
        <button class="side-item" data-page="reports" style="background:none; border:none; color:#fff; text-align:left; padding:10px; cursor:pointer;">Reports</button>

      </aside>

      <!-- MAIN CONTENT -->
      <main class="admin-main" id="adminContent" style="flex:1; padding:20px; overflow-y:auto;">
        <div class="loader-screen" style="min-height:200px; display:flex; justify-content:center; align-items:center;">
          <div class="spinner"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- GENERIC MODAL -->
  <div class="modal-overlay" id="adminModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:9999;">
    <div class="modal" style="background:#121218; padding:20px; border-radius:12px; width:90%; max-width:400px;">
      <div class="modal-header" style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <h3 id="modalTitle" style="margin:0;">Modal</h3>
        <button class="modal-close" id="modalClose" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- UPI SETTINGS MODAL -->
  <div class="modal-overlay" id="paymentSettingsModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:9999;">
    <div class="modal" style="background:#121218; padding:20px; border-radius:12px; width:90%; max-width:400px;">
      <div class="modal-header" style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <h3 style="margin:0;">⚙️ UPI Settings</h3>
        <button class="modal-close" onclick="document.getElementById('paymentSettingsModal').style.display='none'" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
      </div>
      <div class="input-group" style="margin-bottom:15px;">
        <label style="display:block; font-size:12px; color:#888; margin-bottom:5px;">UPI ID</label>
        <input type="text" id="adminUpiId" placeholder="yourname@ybl" style="width:100%; padding:10px; background:#0a0a12; border:1px solid #333; color:#fff; border-radius:8px; box-sizing:border-box;">
      </div>
      <div class="input-group" style="margin-bottom:15px;">
        <label style="display:block; font-size:12px; color:#888; margin-bottom:5px;">QR Code URL</label>
        <input type="text" id="adminQrUrl" placeholder="https://..." style="width:100%; padding:10px; background:#0a0a12; border:1px solid #333; color:#fff; border-radius:8px; box-sizing:border-box;">
      </div>
      <button class="btn-primary" id="savePaymentSettingsBtn" style="width:100%; padding:12px; background:#ff2e63; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Save Settings</button>
    </div>
  </div>

  <!-- ADD PLAN MODAL -->
  <div class="modal-overlay" id="addPlanModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:9999;">
    <div class="modal" style="background:#121218; padding:20px; border-radius:12px; width:90%; max-width:400px;">
      <div class="modal-header" style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <h3 style="margin:0;">➕ Add Plan</h3>
        <button class="modal-close" onclick="document.getElementById('addPlanModal').style.display='none'" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">&times;</button>
      </div>
      <div class="input-group" style="margin-bottom:15px;">
        <label style="display:block; font-size:12px; color:#888; margin-bottom:5px;">Amount (₹)</label>
        <input type="number" id="planAmount" placeholder="e.g. 29" style="width:100%; padding:10px; background:#0a0a12; border:1px solid #333; color:#fff; border-radius:8px; box-sizing:border-box;">
      </div>
      <div class="input-group" style="margin-bottom:15px;">
        <label style="display:block; font-size:12px; color:#888; margin-bottom:5px;">Validity (Days)</label>
        <input type="number" id="planDays" placeholder="e.g. 30" style="width:100%; padding:10px; background:#0a0a12; border:1px solid #333; color:#fff; border-radius:8px; box-sizing:border-box;">
      </div>
      <button class="btn-primary" id="savePlanBtn" style="width:100%; padding:12px; background:#ff2e63; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Save Plan</button>
    </div>
  </div>

  <!-- ✅ ERROR CATCHER & FALLBACK -->
  <script>
    // Agar koi JS error aaye toh alert me dikhega
    window.onerror = function(msg, url, line, col, error) {
      alert("Admin JS Error: " + msg + "\nLine: " + line);
      return false;
    };

    // Agar 5 second tak JS load na ho (ya error de), toh Login screen dikha do
    setTimeout(function() {
      var loader = document.getElementById('loader');
      var login = document.getElementById('adminLogin');
      if (loader && loader.style.display !== 'none') {
        loader.style.display = 'none';
        if (login) {
          login.style.display = 'flex';
        }
      }
    }, 5000);
  </script>

  <script type="module" src="admin.js"></script>

</body>
</html>
