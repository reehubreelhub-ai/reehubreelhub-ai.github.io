<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>ReelHub Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <!-- ================= LOADER ================= -->
  <div class="loader-screen" id="loader">
    <div class="spinner"></div>
    <div style="color:#888;font-size:13px;">Checking access...</div>
  </div>

  <!-- ================= LOGIN ================= -->
  <div id="adminLogin" style="display:none;">
    <div class="login-box">
      <div class="login-logo">ReelHub</div>
      <div class="login-sub">Admin Panel</div>

      <div class="login-title">Sign in</div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="adminEmail" placeholder="admin@reelhub.com">
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="adminPass" placeholder="••••••">
      </div>

      <button class="btn-primary" id="adminLoginBtn">Log In</button>
      <div class="error-msg" id="adminLoginMsg"></div>
    </div>
  </div>

  <!-- ================= ADMIN APP ================= -->
  <div id="adminApp">

    <header class="admin-header">
      <div class="logo">ReelHub <span class="badge">ADMIN</span></div>
      <div class="user-info">
        <span id="adminName">Admin</span>
        <button id="adminLogout">Logout</button>
      </div>
    </header>

    <div class="admin-body">

      <!-- Sidebar -->
      <aside class="admin-sidebar">
        <button class="side-item active" data-page="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          <span>Dashboard</span>
        </button>

        <button class="side-item" data-page="users">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Users</span>
        </button>

        <button class="side-item" data-page="videos">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>
          <span>Videos</span>
        </button>

        <button class="side-item" data-page="comments">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>Comments</span>
        </button>

        <button class="side-item" data-page="admins">
          <svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 1-4.5 4.5L17.5 20 12 17l-5.5 3 1-6.5L3 9l6-1z"/></svg>
          <span>Admins</span>
        </button>

        <button class="side-item" data-page="notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>Notify</span>
        </button>

        <button class="side-item" data-page="reports">
          <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Reports</span>
        </button>
      </aside>

      <!-- Main content -->
      <main class="admin-main" id="adminContent">
        <div class="loader-screen" style="min-height:200px;">
          <div class="spinner"></div>
        </div>
      </main>

    </div>

  </div>

  <!-- ================= MODAL (Generic) ================= -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>

</body>
</html>
