<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>ReelHub Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer"></div>

  <!-- LOADER -->
  <div class="loader-screen" id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Checking access...</div>
  </div>

  <!-- LOGIN -->
  <div id="adminLogin">
    <div class="login-box">
      <div class="login-logo">ReelHub</div>
      <div class="login-sub">Admin Panel</div>
      <div class="login-title">Sign in</div>

      <div class="input-group">
        <label for="adminEmail">Email</label>
        <input type="email" id="adminEmail" placeholder="admin@reelhub.com" autocomplete="username">
      </div>

      <div class="input-group">
        <label for="adminPass">Password</label>
        <input type="password" id="adminPass" placeholder="••••••" autocomplete="current-password">
      </div>

      <button class="btn-primary" id="adminLoginBtn">Log In</button>
      <div class="error-msg" id="adminLoginMsg"></div>
    </div>
  </div>

  <!-- ADMIN APP -->
  <div id="adminApp">
    <header class="admin-header">
      <div class="logo">ReelHub <span class="badge">ADMIN</span></div>
      <div class="user-info">
        <span id="adminName">Admin</span>
        <button id="adminLogout">Logout</button>
      </div>
    </header>

    <div class="admin-body">
      <!-- Sidebar -->
      <aside class="admin-sidebar">
        <button class="side-item active" data-page="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="side-item" data-page="users">
          <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>Users</span>
        </button>
        <button class="side-item" data-page="videos">
          <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>
          <span>Videos</span>
        </button>
        <button class="side-item" data-page="comments">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>Comments</span>
        </button>

        <!-- PAYMENTS -->
        <button class="side-item" data-page="payments">
          <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          <span>Payments</span>
        </button>

        <button class="side-item" data-page="admins">
          <svg viewBox="0 0 24 24"><path d="M12 2l3 6 6 1-4.5 4.5L17.5 20 12 17l-5.5 3 1-6.5L3 9l6-1z"/></svg>
          <span>Admins</span>
        </button>
        <button class="side-item" data-page="notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span>Notify</span>
        </button>
        <button class="side-item" data-page="reports">
          <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <span>Reports</span>
        </button>
      </aside>

      <!-- Main content -->
      <main class="admin-main" id="adminContent">
        <div class="loader-screen" style="min-height:200px;">
          <div class="spinner"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- ================= GENERIC MODAL ================= -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="modal-close" data-close="adminModal">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ================= UPI SETTINGS MODAL ================= -->
  <div class="modal-overlay" id="paymentSettingsModal">
    <div class="modal">
      <div class="modal-header">
        <h3>⚙️ UPI Payment Settings</h3>
        <button class="modal-close" data-close="paymentSettingsModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label for="adminUpiId">UPI ID (e.g. yourname@ybl)</label>
          <input type="text" id="adminUpiId" placeholder="yourname@ybl" autocomplete="off">
        </div>
        <div class="input-group">
          <label for="adminUpiName">Payee Name (optional)</label>
          <input type="text" id="adminUpiName" placeholder="ReelHub" autocomplete="off">
        </div>
        <div class="input-group">
          <label for="adminQrUrl">QR Code Image URL</label>
          <input type="text" id="adminQrUrl" placeholder="https://res.cloudinary.com/....png" autocomplete="off">
        </div>
        <div id="qrPreviewWrap" class="qr-preview-wrap" style="display:none;">
          <img id="qrPreview" alt="QR Preview">
        </div>
        <button class="btn-primary" id="savePaymentSettingsBtn">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- ================= ADD PLAN MODAL ================= -->
  <div class="modal-overlay" id="addPlanModal">
    <div class="modal">
      <div class="modal-header">
        <h3>➕ Add New Payment Plan</h3>
        <button class="modal-close" data-close="addPlanModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="input-group">
          <label for="planAmount">Amount (₹)</label>
          <input type="number" id="planAmount" placeholder="e.g. 29" min="1" step="1">
        </div>
        <div class="input-group">
          <label for="planDays">Validity (Days)</label>
          <input type="number" id="planDays" placeholder="e.g. 30" min="1" step="1">
        </div>
        <div class="input-group">
          <label for="planLabel">Plan Label (optional)</label>
          <input type="text" id="planLabel" placeholder="e.g. 1 Month Premium" autocomplete="off">
        </div>
        <button class="btn-primary" id="savePlanBtn">Save Plan</button>
      </div>
    </div>
  </div>

  <!-- ================= GLOBAL ERROR LOGGER (non-blocking) ================= -->
  <script>
    window.addEventListener('error', function (e) {
      console.error('[ReelHub Admin] JS Error:', e.message, '|', e.filename + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      console.error('[ReelHub Admin] Promise Error:', e.reason);
    });

    /* Fallback: agar module load na ho paye to login screen dikha do */
    setTimeout(function () {
      var loader = document.getElementById('loader');
      var login  = document.getElementById('adminLogin');
      if (loader && getComputedStyle(loader).display !== 'none') {
        loader.style.display = 'none';
        if (login) login.style.display = 'flex';
        var m = document.getElementById('adminLoginMsg');
        if (m) m.textContent = 'Connection failed. Check admin.js path & Firebase config.';
      }
    }, 8000);
  </script>

  <script type="module" src="admin.js"></script>
</body>
</html>
