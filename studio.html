<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>ReelHub Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff2e63'/><text x='50' y='55' font-size='60' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle' dominant-baseline='middle'>R</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;padding-bottom:80px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;outline:none;border:none}
img{display:block;max-width:100%}
svg{display:block;flex-shrink:0}
a{color:inherit;text-decoration:none}

#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0a0a0a;z-index:9999;padding:20px;text-align:center}
.spinner{width:44px;height:44px;border:3px solid #1e1e28;border-top-color:#ff2e63;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading h2{font-size:15px;font-weight:700;color:#fff}
#loading p{font-size:13px;color:#888;line-height:1.5;max-width:340px}
#loading .btn{display:inline-block;background:linear-gradient(90deg,#ff2e63,#ff8a00);color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;margin-top:10px}

#app{display:none;flex-direction:column;min-height:100vh}
#app.show{display:flex}

/* ========= TOP BAR ========= */
.topbar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0f0f16;border-bottom:1px solid #1a1a1a;position:sticky;top:0;z-index:50}
.logo{font-size:18px;font-weight:900;background:linear-gradient(90deg,#ff2e63,#ff8a00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-badge{font-size:8px;font-weight:800;padding:3px 5px;background:#ff2e63;color:#fff;border-radius:4px;margin-left:4px;-webkit-text-fill-color:#fff}
.topbar-right{display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#1a1a1a;border:2px solid #1e1e28;cursor:pointer}

/* ========= STATS HEADER ========= */
.stats-header{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#1a1a1a;border-bottom:1px solid #1a1a1a}
.stat-item{background:#0f0f16;padding:14px 8px;text-align:center}
.stat-item .sv{font-size:18px;font-weight:900;color:#fff;line-height:1;margin-bottom:4px}
.stat-item .sl{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px}

/* ========= MAIN CONTENT ========= */
.content{flex:1;padding:14px;padding-bottom:90px;max-width:700px;margin:0 auto;width:100%}

.hero{margin-bottom:16px}
.hero h1{font-size:20px;font-weight:900;margin-bottom:4px;letter-spacing:-.3px}
.hero p{font-size:12px;color:#888}

/* ========= VIDEO CARD ========= */
.video-card{background:#121212;border:1px solid #1e1e28;border-radius:12px;padding:10px;margin-bottom:10px;display:flex;gap:10px;cursor:pointer;transition:background .15s}
.video-card:active{background:#1a1a24}
.vc-thumb{position:relative;width:100px;height:56px;border-radius:8px;overflow:hidden;background:#1a1a1a;flex-shrink:0}
.vc-thumb img{width:100%;height:100%;object-fit:cover}
.vc-thumb.wide{width:100px;height:56px}
.vc-thumb.tall{width:56px;height:100px}
.vc-duration{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.85);color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px}
.vc-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.vc-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.vc-stats{display:flex;gap:10px;font-size:10.5px;color:#888;flex-wrap:wrap;align-items:center}
.vc-stat{display:flex;align-items:center;gap:3px;font-weight:600}
.vc-stat svg{width:12px;height:12px;stroke:#666;fill:none;stroke-width:2}
.vc-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:8px;font-weight:800;text-transform:uppercase;background:#1a1a24;color:#888}
.vc-badge.short{color:#ff2e63}
.vc-badge.long{color:#4ea8ff}
.vc-badge.photo{color:#4ade80}

/* ========= EMPTY ========= */
.empty{text-align:center;padding:60px 20px;color:#666;font-size:13px}
.empty svg{width:56px;height:56px;stroke:#333;fill:none;stroke-width:1.5;margin:0 auto 14px}

/* ========= BOTTOM NAV ========= */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#0f0f16;border-top:1px solid #1a1a1a;display:flex;align-items:center;justify-content:space-around;padding:0 4px;z-index:100;max-width:700px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1;padding:8px 4px;color:#888;transition:color .15s;max-width:80px}
.bn-item.active{color:#fff}
.bn-item.active svg{stroke:#ff2e63}
.bn-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bn-item span{font-size:10px;font-weight:600}
.bn-upload{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#ff2e63,#ff8a00);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(255,46,99,.5);margin-top:-14px}
.bn-upload svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.5}

/* ========= MODAL ========= */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9000;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex}
.modal{background:#14141c;border-top-left-radius:22px;border-top-right-radius:22px;padding:20px;width:100%;max-width:700px;max-height:85vh;overflow-y:auto;animation:modalUp .25s ease}
@keyframes modalUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:0;background:#14141c;padding-bottom:10px;z-index:5}
.modal-header h3{font-size:17px;font-weight:800}
.modal-close{width:32px;height:32px;border-radius:50%;background:#1e1e28;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}

/* ========= COMMENTS ========= */
.comment-item{padding:12px 0;border-bottom:1px solid #1a1a1a;display:flex;gap:10px}
.comment-item:last-child{border-bottom:none}
.comment-avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#1a1a1a;flex-shrink:0}
.comment-body{flex:1;min-width:0}
.comment-name{font-size:12.5px;font-weight:700;color:#fff;margin-bottom:2px}
.comment-text{font-size:13px;color:#ccc;line-height:1.4;margin-bottom:4px;word-wrap:break-word}
.comment-time{font-size:10.5px;color:#666}
.comment-input-wrap{display:flex;gap:8px;align-items:center;padding:12px 0;border-top:1px solid #1e1e28;position:sticky;bottom:0;background:#14141c}
.comment-input-wrap input{flex:1;height:42px;background:#1a1a24;border:1px solid #262636;border-radius:22px;padding:0 16px;color:#fff;font-size:13px}
.comment-input-wrap input:focus{border-color:#ff2e63}
.comment-send{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#ff2e63,#ff8a00);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.comment-send svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}

/* Toast */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e1e28;color:#fff;padding:10px 18px;border-radius:10px;font-size:12.5px;font-weight:600;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.7);border:1px solid #333;opacity:0;transition:all .3s;pointer-events:none;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h2>Loading Studio...</h2>
  <p id="loadingMsg">Please wait</p>
</div>

<div id="app">
  <div class="topbar">
    <div class="logo">ReelHub<span class="logo-badge">STUDIO</span></div>
    <div class="topbar-right">
      <img class="avatar" id="userAvatar" src="" alt="">
    </div>
  </div>

  <div class="stats-header" id="statsHeader"></div>

  <div class="content" id="content"></div>

  <div class="bottom-nav">
    <button class="bn-item active" id="navHome" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </button>
    <button class="bn-item" id="navVideos" onclick="switchTab('videos')">
      <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>
      <span>Videos</span>
    </button>
    <button class="bn-upload" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="bn-item" id="navAudience" onclick="switchTab('audience')">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Audience</span>
    </button>
    <button class="bn-item" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Account</span>
    </button>
  </div>
</div>

<div class="modal-overlay" id="commentsModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="commentsTitle">Comments</h3>
      <button class="modal-close" onclick="closeCommentsModal()">✕</button>
    </div>
    <div id="commentsList"></div>
    <div class="comment-input-wrap" id="commentInputWrap" style="display:none">
      <input type="text" id="commentInput" placeholder="Add a comment...">
      <button class="comment-send" onclick="postComment()">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
console.log('=== Studio: Starting ===');

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, addDoc, collection, query, where, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

console.log('=== Studio: Imports OK ===');

const firebaseConfig = {
  apiKey: "AIzaSyC6421R1kr0jYwUJFbjB2YzIerlJw_cdLc",
  authDomain: "reelhub-24616.firebaseapp.com",
  projectId: "reelhub-24616",
  storageBucket: "reelhub-24616.appspot.com",
  messagingSenderId: "397521504045",
  appId: "1:397521504045:web:bf6d3652a7375fd632b5a4",
  measurementId: "G-81RN37XN6H"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

console.log('=== Studio: Firebase Ready ===');

let currentUser = null;
let currentProfile = null;
let allPosts = [];
let currentTab = 'home';
let activeCommentsPostId = null;

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function defaultAvatar(name) {
  const letter = ((name || '?').charAt(0) || '?').toUpperCase().replace(/[<>&"']/g, '');
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1e1e28"/><text x="50" y="50" font-size="44" font-family="sans-serif" font-weight="700" fill="#fff" text-anchor="middle" dominant-baseline="central">' + letter + '</text></svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function formatNum(n) {
  n = parseInt(n) || 0;
  if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'') + 'M';
  if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return n.toString();
}

function formatDuration(sec) {
  if (!sec || sec <= 0) return '';
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function timeAgo(date) {
  if (!date) return 'just now';
  const s = Math.floor((new Date() - date) / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s/60);
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m/60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h/24);
  if (d < 7) return d + 'd ago';
  return Math.floor(d/7) + 'w ago';
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('show'), 2000);
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById('loadingMsg').innerHTML = 
      'Not logged in. Redirecting...<br><br>' +
      '<a class="btn" href="index.html">← Go to Login</a>';
    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    return;
  }

  currentUser = user;

  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    currentProfile = snap.exists() ? { uid: snap.id, ...snap.data() } : { name: 'User' };
    if (!Array.isArray(currentProfile.followers)) currentProfile.followers = [];
    if (!Array.isArray(currentProfile.following)) currentProfile.following = [];

    const q = query(collection(db, 'posts'), where('userId', '==', user.uid));
    const postsSnap = await getDocs(q);
    allPosts = postsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    allPosts.sort((a, b) => (b.createdAt?.toDate?.()?.getTime() || 0) - (a.createdAt?.toDate?.()?.getTime() || 0));

    document.getElementById('userAvatar').src = currentProfile.photo || defaultAvatar(currentProfile.name);
    document.getElementById('userAvatar').onclick = () => window.location.href = 'index.html';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').classList.add('show');

    renderStatsHeader();
    switchTab('home');

  } catch (e) {
    console.error('=== Studio: Error ===', e);
    document.getElementById('loadingMsg').innerHTML = 
      '❌ Error: ' + (e.message || e) + '<br><br>' +
      '<a class="btn" href="index.html">← Back to App</a>';
  }
});

function renderStatsHeader() {
  const followers = (currentProfile.followers || []).length;
  const following = (currentProfile.following || []).length;
  const totalViews = allPosts.reduce((s, p) => s + (p.views || 0), 0);

  document.getElementById('statsHeader').innerHTML = `
    <div class="stat-item"><div class="sv">${formatNum(followers)}</div><div class="sl">Followers</div></div>
    <div class="stat-item"><div class="sv">${formatNum(following)}</div><div class="sl">Following</div></div>
    <div class="stat-item"><div class="sv">${formatNum(totalViews)}</div><div class="sl">Views</div></div>
  `;
}

window.switchTab = function(tab) {
  currentTab = tab;
  document.querySelectorAll('.bn-item').forEach(b => b.classList.remove('active'));
  const map = { home: 'navHome', videos: 'navVideos', audience: 'navAudience' };
  document.getElementById(map[tab])?.classList.add('active');

  if (tab === 'home') renderHome();
  else if (tab === 'videos') renderVideos();
  else if (tab === 'audience') renderAudience();
};

function renderHome() {
  const totalViews = allPosts.reduce((s, p) => s + (p.views || 0), 0);
  const totalLikes = allPosts.reduce((s, p) => s + ((p.likes || []).length), 0);
  const totalComments = allPosts.reduce((s, p) => s + (p.commentsCount || 0), 0);

  const recent = allPosts.slice(0, 5);

  document.getElementById('content').innerHTML = `
    <div class="hero">
      <h1>Hi, ${esc(currentProfile.name || 'Creator')} 👋</h1>
      <p>Here's how your content is doing</p>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;">
      <div class="video-card" style="flex-direction:column;align-items:center;text-align:center;padding:14px 6px;margin:0;">
        <div style="font-size:20px;font-weight:900;color:#fff;">${formatNum(totalViews)}</div>
        <div style="font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;">Views</div>
      </div>
      <div class="video-card" style="flex-direction:column;align-items:center;text-align:center;padding:14px 6px;margin:0;">
        <div style="font-size:20px;font-weight:900;color:#fff;">${formatNum(totalLikes)}</div>
        <div style="font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;">Likes</div>
      </div>
      <div class="video-card" style="flex-direction:column;align-items:center;text-align:center;padding:14px 6px;margin:0;">
        <div style="font-size:20px;font-weight:900;color:#fff;">${formatNum(totalComments)}</div>
        <div style="font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:4px;">Comments</div>
      </div>
    </div>

    <div style="font-size:14px;font-weight:800;color:#fff;margin:20px 0 12px;">Recent Videos</div>
    ${recent.length === 0 ? `
      <div class="empty">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polygon points="10,8 16,12 10,16"/></svg>
        <div>No videos yet — upload your first!</div>
      </div>
    ` : recent.map(p => renderVideoCard(p)).join('')}
  `;
}

function renderVideoCard(p) {
  const thumbClass = p.type === 'short' ? 'tall' : 'wide';
  const duration = p.duration ? formatDuration(p.duration) : '';
  const views = p.views || 0;
  const likes = (p.likes || []).length;
  const comments = p.commentsCount || 0;
  const shares = p.shares || 0;

  return `
    <div class="video-card" onclick="openComments('${p.id}', '${esc(p.caption || 'Untitled')}')">
      <div class="vc-thumb ${thumbClass}">
        <img src="${p.thumbnail || p.url}" alt="" onerror="this.style.display='none'">
        ${duration ? `<div class="vc-duration">${duration}</div>` : ''}
      </div>
      <div class="vc-info">
        <div class="vc-title">${esc(p.caption || 'Untitled')}</div>
        <div class="vc-stats">
          <span class="vc-badge ${p.type || 'short'}">${p.type || 'short'}</span>
          <span class="vc-stat">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            ${formatNum(views)}
          </span>
          <span class="vc-stat">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            ${formatNum(likes)}
          </span>
          <span class="vc-stat">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            ${formatNum(comments)}
          </span>
          <span class="vc-stat">
            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            ${formatNum(shares)}
          </span>
        </div>
      </div>
    </div>
  `;
}

function renderVideos() {
  document.getElementById('content').innerHTML = `
    <div class="hero">
      <h1>My Videos</h1>
      <p>${allPosts.length} video${allPosts.length !== 1 ? 's' : ''} uploaded</p>
    </div>
    ${allPosts.length === 0 ? `
      <div class="empty">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polygon points="10,8 16,12 10,16"/></svg>
        <div>No videos yet</div>
      </div>
    ` : allPosts.map(p => renderVideoCard(p)).join('')}
  `;
}

async function renderAudience() {
  const followers = currentProfile.followers || [];
  const following = currentProfile.following || [];

  document.getElementById('content').innerHTML = `
    <div class="hero">
      <h1>Audience</h1>
      <p>People connected to your account</p>
    </div>

    <div style="font-size:14px;font-weight:800;color:#fff;margin:16px 0 12px;">Followers (${followers.length})</div>
    <div id="followersList" class="empty">Loading...</div>

    <div style="font-size:14px;font-weight:800;color:#fff;margin:24px 0 12px;">Following (${following.length})</div>
    <div id="followingList" class="empty">Loading...</div>
  `;

  loadUsers(followers, 'followersList');
  loadUsers(following, 'followingList');
}

async function loadUsers(uids, containerId) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;

  if (uids.length === 0) {
    wrap.innerHTML = '<div>No users yet</div>';
    return;
  }

  const users = [];
  for (const uid of uids.slice(0, 30)) {
    try {
      const snap = await getDoc(doc(db, 'users', uid));
      if (snap.exists()) users.push({ uid, ...snap.data() });
    } catch (e) {}
  }

  if (users.length === 0) {
    wrap.innerHTML = '<div>Users not found</div>';
    return;
  }

  wrap.innerHTML = users.map(u => `
    <div class="video-card" style="padding:10px;">
      <img src="${u.photo || defaultAvatar(u.name)}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;background:#1a1a1a;flex-shrink:0;">
      <div class="vc-info">
        <div class="vc-title" style="margin-bottom:2px;">${esc(u.name || 'User')}</div>
        <div style="font-size:11.5px;color:#888;">@${esc(u.user || '')}</div>
      </div>
    </div>
  `).join('');
}

/* ========= COMMENTS ========= */
window.openComments = async function(postId, title) {
  activeCommentsPostId = postId;
  document.getElementById('commentsTitle').textContent = title || 'Comments';
  document.getElementById('commentsList').innerHTML = '<div class="empty">Loading...</div>';
  document.getElementById('commentsModal').classList.add('show');
  document.getElementById('commentInputWrap').style.display = 'flex';

  try {
    const q = query(collection(db, 'comments'), where('postId', '==', postId));
    const snap = await getDocs(q);
    const comments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    comments.sort((a, b) => (b.createdAt?.toDate?.()?.getTime() || 0) - (a.createdAt?.toDate?.()?.getTime() || 0));
    renderCommentsList(comments);
  } catch (e) {
    document.getElementById('commentsList').innerHTML = '<div class="empty">Could not load comments</div>';
  }
};

function renderCommentsList(comments) {
  if (comments.length === 0) {
    document.getElementById('commentsList').innerHTML = '<div class="empty">No comments yet<br>Be the first to comment!</div>';
    return;
  }
  document.getElementById('commentsList').innerHTML = comments.map(c => `
    <div class="comment-item">
      <img class="comment-avatar" src="${c.userPhoto || defaultAvatar(c.userName)}" alt="">
      <div class="comment-body">
        <div class="comment-name">${esc(c.userName || 'User')}</div>
        <div class="comment-text">${esc(c.text || '')}</div>
        <div class="comment-time">${timeAgo(c.createdAt?.toDate?.())}</div>
      </div>
    </div>
  `).join('');
}

window.closeCommentsModal = function() {
  document.getElementById('commentsModal').classList.remove('show');
  activeCommentsPostId = null;
};

window.postComment = async function() {
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text || !activeCommentsPostId || !currentUser) return;

  input.disabled = true;
  try {
    await addDoc(collection(db, 'comments'), {
      postId: activeCommentsPostId,
      userId: currentUser.uid,
      userName: currentProfile.name || 'User',
      userHandle: currentProfile.user || '',
      userPhoto: currentProfile.photo || '',
      userVerified: currentProfile.verified || false,
      text: text,
      likes: [],
      parentId: null,
      createdAt: serverTimestamp()
    });

    const postRef = doc(db, 'posts', activeCommentsPostId);
    const postSnap = await getDoc(postRef);
    if (postSnap.exists()) {
      const cur = postSnap.data().commentsCount || 0;
      const { updateDoc } = await import("https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js");
      await updateDoc(postRef, { commentsCount: cur + 1 });
      const p = allPosts.find(x => x.id === activeCommentsPostId);
      if (p) p.commentsCount = cur + 1;
    }

    input.value = '';
    toast('✅ Comment posted');
    openComments(activeCommentsPostId, document.getElementById('commentsTitle').textContent);
  } catch (e) {
    console.error(e);
    toast('❌ Failed to post comment');
  } finally {
    input.disabled = false;
  }
};
