<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelHub</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 45px;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(
        90deg,
        #ff0050,
        #8b5cf6,
        #00c6ff
      );
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #999;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      margin: 8px 0;
      font-size: 16px;
      font-weight: 700;
    }

    .skip {
      background: transparent;
      color: #aaa;
    }

    .google {
      background: #fff;
      color: #111;
    }

    .primary {
      background: linear-gradient(
        90deg,
        #ff0050,
        #8b5cf6
      );
      color: #fff;
    }

    .secondary {
      background: #202020;
      color: #fff;
    }

    .form {
      display: none;
    }

    .form h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      height: 52px;
      margin: 7px 0;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #151515;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    .small {
      color: #999;
      margin-top: 15px;
      font-size: 14px;
    }

    .link {
      color: #9b7cff;
      cursor: pointer;
      font-weight: bold;
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      color: #ff9db7;
      font-size: 14px;
      line-height: 1.4;
    }

    /* APP */

    #app {
      display: none;
      min-height: 100vh;
      background: #080808;
    }

    .top {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #222;
    }

    .top-logo {
      font-size: 25px;
      font-weight: 800;
      background: linear-gradient(
        90deg,
        #ff0050,
        #8b5cf6
      );
      -webkit-background-clip: text;
      color: transparent;
    }

    .content {
      padding: 35px 20px;
      text-align: center;
    }

    .profile {
      width: 95px;
      height: 95px;
      border-radius: 50%;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 22px auto;
      font-size: 40px;
      overflow: hidden;
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .email {
      color: #888;
      margin-top: 8px;
    }

    .guest-note {
      color: #777;
      margin-top: 12px;
    }

    .logout {
      background: #222;
      color: #fff;
      padding: 13px 28px;
      border-radius: 12px;
      margin-top: 25px;
      font-size: 15px;
      font-weight: 600;
    }

    .logout:hover {
      background: #333;
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH SCREEN
  ========================== -->

  <div id="authScreen" class="screen">

    <div class="auth-box">

      <!-- WELCOME -->

      <div id="welcome">

        <div class="logo">
          ReelHub
        </div>

        <div class="subtitle">
          Watch • Create • Share
        </div>

        <!-- SKIP -->

        <button
          class="btn skip"
          id="skipBtn">
          Skip
        </button>

        <!-- GOOGLE -->

        <button
          class="btn google"
          id="googleBtn">
          Continue with Google
        </button>

        <!-- CREATE -->

        <button
          class="btn primary"
          id="createBtn">
          Create Account
        </button>

        <!-- LOGIN -->

        <button
          class="btn secondary"
          id="loginBtn">
          Login
        </button>

        <div
          id="welcomeMessage"
          class="message">
        </div>

      </div>


      <!-- =========================
           CREATE ACCOUNT
      ========================== -->

      <div id="createForm" class="form">

        <h2>
          Create Account
        </h2>

        <input
          id="signupName"
          type="text"
          placeholder="Full Name"
          autocomplete="name">

        <input
          id="signupEmail"
          type="email"
          placeholder="Email"
          autocomplete="email">

        <input
          id="signupPassword"
          type="password"
          placeholder="Password (minimum 6 characters)"
          autocomplete="new-password">

        <button
          class="btn primary"
          id="createAccountBtn">
          Create Account
        </button>

        <div
          id="createMessage"
          class="message">
        </div>

        <div class="small">
          Already have an account?
          <span
            class="link"
            id="toLogin">
            Login
          </span>
        </div>

        <div class="small">
          <span
            class="link"
            id="backFromCreate">
            ← Back
          </span>
        </div>

      </div>


      <!-- =========================
           LOGIN
      ========================== -->

      <div id="loginForm" class="form">

        <h2>
          Login
        </h2>

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          autocomplete="email">

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password">

        <button
          class="btn primary"
          id="loginAccountBtn">
          Login
        </button>

        <button
          class="btn google"
          id="googleBtn2">
          Continue with Google
        </button>

        <div
          id="loginMessage"
          class="message">
        </div>

        <div class="small">
          Don't have an account?
          <span
            class="link"
            id="toCreate">
            Create Account
          </span>
        </div>

        <div class="small">
          <span
            class="link"
            id="backFromLogin">
            ← Back
          </span>
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       MAIN APP
  ========================== -->

  <div id="app">

    <div class="top">

      <div class="top-logo">
        ReelHub
      </div>

      <div>
        🏠
      </div>

    </div>


    <div class="content">

      <h1>
        Welcome to ReelHub
      </h1>

      <div
        class="profile"
        id="profileIcon">
        👤
      </div>

      <h2 id="userName">
        Guest
      </h2>

      <p
        id="userEmail"
        class="email">
        Browsing as Guest
      </p>

      <p
        id="guestNote"
        class="guest-note">
      </p>

      <button
        class="logout"
        id="logoutBtn">
        Logout
      </button>

    </div>

  </div>


  <!-- =========================
       FIREBASE
  ========================== -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut,
      updateProfile
    } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    /* =========================
       YOUR FIREBASE CONFIG
    ========================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyC6421R1kr0jYwUJFbjB2YzIerlJw_cdLc",

      authDomain:
        "reelhub-24616.firebaseapp.com",

      projectId:
        "reelhub-24616",

      storageBucket:
        "reelhub-24616.firebasestorage.app",

      messagingSenderId:
        "397521504045",

      appId:
        "1:397521504045:web:bf6d3652a7375fd632b5a4",

      measurementId:
        "G-81RN37XN6H"

    };


    /* =========================
       INITIALIZE FIREBASE
    ========================== */

    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const googleProvider =
      new GoogleAuthProvider();


    /* =========================
       ELEMENTS
    ========================== */

    const authScreen =
      document.getElementById("authScreen");

    const appScreen =
      document.getElementById("app");

    const welcome =
      document.getElementById("welcome");

    const createForm =
      document.getElementById("createForm");

    const loginForm =
      document.getElementById("loginForm");


    /* =========================
       SHOW WELCOME
    ========================== */

    function showWelcome() {

      welcome.style.display =
        "block";

      createForm.style.display =
        "none";

      loginForm.style.display =
        "none";

      clearMessages();
    }


    /* =========================
       SHOW CREATE
    ========================== */

    function showCreate() {

      welcome.style.display =
        "none";

      createForm.style.display =
        "block";

      loginForm.style.display =
        "none";

      clearMessages();
    }


    /* =========================
       SHOW LOGIN
    ========================== */

    function showLogin() {

      welcome.style.display =
        "none";

      createForm.style.display =
        "none";

      loginForm.style.display =
        "block";

      clearMessages();
    }


    /* =========================
       CLEAR MESSAGES
    ========================== */

    function clearMessages() {

      document.getElementById(
        "welcomeMessage"
      ).textContent = "";

      document.getElementById(
        "createMessage"
      ).textContent = "";

      document.getElementById(
        "loginMessage"
      ).textContent = "";
    }


    /* =========================
       FIREBASE ERROR
    ========================== */

    function firebaseError(error) {

      const messages = {

        "auth/email-already-in-use":
          "This email is already registered.",

        "auth/invalid-email":
          "Please enter a valid email.",

        "auth/weak-password":
          "Password must contain at least 6 characters.",

        "auth/invalid-credential":
          "Email or password is incorrect.",

        "auth/user-not-found":
          "No account found with this email.",

        "auth/wrong-password":
          "Email or password is incorrect.",

        "auth/popup-closed-by-user":
          "Google login was cancelled.",

        "auth/popup-blocked":
          "The browser blocked the Google login popup.",

        "auth/unauthorized-domain":
          "This domain is not authorized in Firebase.",

        "auth/network-request-failed":
          "Network error. Check your internet connection."

      };

      return (
        messages[error?.code] ||
        error?.message ||
        "Something went wrong."
      );
    }


    /* =========================
       GOOGLE LOGIN
    ========================== */

    async function googleLogin() {

      clearMessages();

      try {

        await signInWithPopup(
          auth,
          googleProvider
        );

      } catch (error) {

        const message =
          firebaseError(error);

        document.getElementById(
          "welcomeMessage"
        ).textContent = message;

        document.getElementById(
          "loginMessage"
        ).textContent = message;

      }

    }


    /* =========================
       CREATE ACCOUNT
    ========================== */

    async function createAccount() {

      const name =
        document.getElementById(
          "signupName"
        ).value.trim();


      const email =
        document.getElementById(
          "signupEmail"
        ).value.trim();


      const password =
        document.getElementById(
          "signupPassword"
        ).value;


      const message =
        document.getElementById(
          "createMessage"
        );


      message.textContent = "";


      if (
        !name ||
        !email ||
        !password
      ) {

        message.textContent =
          "Please fill all fields.";

        return;
      }


      if (password.length < 6) {

        message.textContent =
          "Password must contain at least 6 characters.";

        return;
      }


      try {

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await updateProfile(
          result.user,
          {
            displayName: name
          }
        );


      } catch (error) {

        message.textContent =
          firebaseError(error);

      }

    }


    /* =========================
       EMAIL LOGIN
    ========================== */

    async function loginAccount() {

      const email =
        document.getElementById(
          "loginEmail"
        ).value.trim();


      const password =
        document.getElementById(
          "loginPassword"
        ).value;


      const message =
        document.getElementById(
          "loginMessage"
        );


      message.textContent = "";


      if (!email || !password) {

        message.textContent =
          "Please enter email and password.";

        return;
      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        message.textContent =
          firebaseError(error);

      }

    }


    /* =========================
       SKIP LOGIN
    ========================== */

    function skipLogin() {

      authScreen.style.display =
        "none";

      appScreen.style.display =
        "block";


      document.getElementById(
        "userName"
      ).textContent =
        "Guest";


      document.getElementById(
        "userEmail"
      ).textContent =
        "Browsing as Guest";


      document.getElementById(
        "guestNote"
      ).textContent =
        "You are using ReelHub as a guest.";

    }


    /* =========================
       LOGOUT
    ========================== */

    async function logoutUser() {

      try {

        await signOut(auth);

        appScreen.style.display =
          "none";

        authScreen.style.display =
          "flex";

        showWelcome();

      } catch (error) {

        alert(
          firebaseError(error)
        );

      }

    }


    /* =========================
       BUTTON EVENTS
    ========================== */

    document
      .getElementById("skipBtn")
      .addEventListener(
        "click",
        skipLogin
      );


    document
      .getElementById("googleBtn")
      .addEventListener(
        "click",
        googleLogin
      );


    document
      .getElementById("googleBtn2")
      .addEventListener(
        "click",
        googleLogin
      );


    document
      .getElementById("createBtn")
      .addEventListener(
        "click",
        showCreate
      );


    document
      .getElementById("loginBtn")
      .addEventListener(
        "click",
        showLogin
      );


    document
      .getElementById("createAccountBtn")
      .addEventListener(
        "click",
        createAccount
      );


    document
      .getElementById("loginAccountBtn")
      .addEventListener(
        "click",
        loginAccount
      );


    document
      .getElementById("toLogin")
      .addEventListener(
        "click",
        showLogin
      );


    document
      .getElementById("toCreate")
      .addEventListener(
        "click",
        showCreate
      );


    document
      .getElementById("backFromCreate")
      .addEventListener(
        "click",
        showWelcome
      );


    document
      .getElementById("backFromLogin")
      .addEventListener(
        "click",
        showWelcome
      );


    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        logoutUser
      );


    /* =========================
       AUTH STATE
    ========================== */

    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          authScreen.style.display =
            "none";

          appScreen.style.display =
            "block";


          document.getElementById(
            "userName"
          ).textContent =
            user.displayName ||
            "ReelHub User";


          document.getElementById(
            "userEmail"
          ).textContent =
            user.email || "";


          document.getElementById(
            "guestNote"
          ).textContent = "";


          if (user.photoURL) {

            document.getElementById(
              "profileIcon"
            ).innerHTML =
              `
              <img
                src="${user.photoURL}"
                alt="Profile">
              `;

          }

        }

      }
    );

  </script>

</body>
</html>
