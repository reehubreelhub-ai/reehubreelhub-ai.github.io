<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>ReelHub</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      color: #fff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* ================= AUTH SCREEN ================= */
    #auth {
      display: block;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      background: #000;
    }
    #auth::-webkit-scrollbar { display: none; }

    .auth-wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 28px;
      max-width: 400px;
      margin: 0 auto;
    }

    .auth-logo {
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ff2e63, #ff8a00);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .auth-tagline {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 32px;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
    }

    .input-group {
      position: relative;
      margin-bottom: 12px;
    }

    .input-group input {
      width: 100%;
      height: 52px;
      padding: 0 46px 0 16px;
      background: #121212;
      border: 1px solid #262626;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-group input:focus {
      border-color: #ff2e63;
      background: #161616;
    }
    .input-group input::placeholder { color: #666; }

    .input-group .eye {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #888;
      border-radius: 50%;
    }
    .input-group .eye:hover { color: #fff; }

    .btn-primary {
      width: 100%;
      height: 50px;
      background: linear-gradient(90deg, #ff2e63, #ff8a00);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
      color: #666;
      font-size: 12px;
      font-weight: 600;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #262626;
    }

    .link-row {
      text-align: center;
      font-size: 14px;
      color: #888;
      margin-top: 20px;
    }
    .link-row a {
      color: #ff2e63;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }
    .link-row a:hover { text-decoration: underline; }

    .forgot {
      display: block;
      text-align: right;
      font-size: 13px;
      color: #ff2e63;
      margin: 8px 0 16px;
      text-decoration: none;
      cursor: pointer;
    }

    .error-msg {
      color: #ff4d4d;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      min-height: 18px;
    }

    .success-msg {
      color: #4ade80;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      min-height: 18px;
    }

    .auth-footer {
      text-align: center;
      font-size: 12px;
      color: #555;
      margin-top: 32px;
      line-height: 1.6;
    }

    /* ================= APP LAYOUT ================= */
    #app {
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
    }
    #app.show { display: flex; }

    .header {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #1a1a1a;
      background: #0a0a0a;
      z-index: 10;
    }
    .header .logo {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(90deg, #ff2e63, #ff8a00);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .header .icon-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
      background: none;
      border: none;
      color: #fff;
    }
    .header .icon-btn:hover { background: #1a1a1a; }

    .content {
      flex: 1;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #666;
      font-size: 16px;
    }
    .content::-webkit-scrollbar { display: none; }

    .page-title {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      text-align: center;
    }

    /* ================= BOTTOM NAV (Instagram style) ================= */
    .bottom-nav-wrap {
      position: relative;
      flex-shrink: 0;
      padding: 0 12px 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: #0a0a0a;
    }

    .bottom-nav {
      position: relative;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #101018;
      border: 1px solid #1e1e28;
      border-radius: 22px;
      padding: 0 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    }

    .nav-item {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      color: #9a9aa8;
      transition: color 0.2s;
      background: none;
      border: none;
      font-family: inherit;
      position: relative;
    }
    .nav-item svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }
    .nav-item span {
      font-size: 10px;
      font-weight: 500;
    }
    .nav-item.active { color: #fff; }
    .nav-item.active svg { stroke: #4ea8ff; }

    /* Center Upload button (floating +) */
    .nav-upload {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .upload-btn {
      position: absolute;
      top: -26px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;

      /* gradient blue like reference image */
      background:
        radial-gradient(circle at 30% 25%, #3f8fd6 0%, #2a5f9e 45%, #1c3f6e 100%);
      box-shadow:
        0 0 0 6px #0a0a0a,
        0 10px 22px rgba(46, 122, 200, 0.55),
        inset 0 2px 4px rgba(255, 255, 255, 0.25),
        inset 0 -4px 8px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, box-shadow 0.2s;
    }

    .upload-btn:active {
      transform: scale(0.94);
    }

    .upload-btn svg {
      width: 30px;
      height: 30px;
      stroke: #fff;
      stroke-width: 2.6;
      stroke-linecap: round;
      fill: none;
    }

    .upload-label {
      position: absolute;
      bottom: 6px;
      font-size: 10px;
      font-weight: 600;
      color: #fff;
      pointer-events: none;
    }

    /* Hide the label on the upload (it's inside the circle visually) */
    .nav-upload .upload-label { display: none; }

    /* The center gap inside nav so + button visually sits above */
    .nav-upload .placeholder {
      width: 68px;
      height: 100%;
    }

    @media (min-width: 480px) {
      .bottom-nav {
        max-width: 460px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

  <!-- ================= AUTH (LOGIN / SIGNUP) ================= -->
  <div id="auth">
    <div class="auth-wrap">

      <div class="auth-logo">ReelHub</div>
      <div class="auth-tagline">Short videos. Big vibes. 🎬</div>

      <!-- LOGIN FORM -->
      <form id="loginForm">
        <div class="auth-title">Log in</div>

        <div class="input-group">
          <input type="text" id="loginUser" placeholder="Username or email" autocomplete="username">
        </div>

        <div class="input-group">
          <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
          <div class="eye" data-target="loginPass">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <a class="forgot" id="forgotLink">Forgot password?</a>

        <button type="submit" class="btn-primary">Log In</button>
        <div class="error-msg" id="loginMsg"></div>

        <div class="divider">OR</div>

        <div class="link-row">
          Don't have an account? <a id="goSignup">Sign up</a>
        </div>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" style="display:none;">
        <div class="auth-title">Create account</div>

        <div class="input-group">
          <input type="text" id="signupName" placeholder="Full name" autocomplete="name">
        </div>

        <div class="input-group">
          <input type="text" id="signupUser" placeholder="Username" autocomplete="username">
        </div>

        <div class="input-group">
          <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
        </div>

        <div class="input-group">
          <input type="password" id="signupPass" placeholder="Password (min 6 characters)" autocomplete="new-password">
          <div class="eye" data-target="signupPass">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
        </div>

        <button type="submit" class="btn-primary">Sign Up</button>
        <div class="error-msg" id="signupMsg"></div>

        <div class="divider">OR</div>

        <div class="link-row">
          Already have an account? <a id="goLogin">Log in</a>
        </div>
      </form>

      <div class="auth-footer">
        By continuing, you agree to our Terms & Privacy Policy.
      </div>

    </div>
  </div>

  <!-- ================= MAIN APP ================= -->
  <div id="app">

    <div class="header">
      <div class="logo">ReelHub</div>
      <div class="header-actions">
        <button class="icon-btn" title="Notifications">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
        <button class="icon-btn" id="logoutBtn" title="Logout">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="page-title">Home Feed</div>
    </div>

    <!-- ================= BOTTOM NAV ================= -->
    <div class="bottom-nav-wrap">
      <nav class="bottom-nav">

        <!-- Home -->
        <button class="nav-item active" data-page="home">
          <svg viewBox="0 0 24 24">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5z"/>
          </svg>
          <span>Home</span>
        </button>

        <!-- Shorts (Reels) -->
        <button class="nav-item" data-page="shorts">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <path d="M3 8h6M15 8h6"/>
            <path d="M10 12l5 3-5 3z" fill="currentColor" stroke="none"/>
          </svg>
          <span>Shorts</span>
        </button>

        <!-- Upload (floating +) -->
        <div class="nav-upload">
          <button class="upload-btn" data-page="upload" title="Upload">
            <svg viewBox="0 0 24 24">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>

        <!-- Messages -->
        <button class="nav-item" data-page="messages">
          <svg viewBox="0 0 24 24">
            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          <span>Messages</span>
        </button>

        <!-- Profile -->
        <button class="nav-item" data-page="profile">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
          </svg>
          <span>Profile</span>
        </button>

      </nav>
    </div>

  </div>

  <script>
    (function () {
      const auth = document.getElementById('auth');
      const app  = document.getElementById('app');

      const loginForm  = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const loginMsg   = document.getElementById('loginMsg');
      const signupMsg  = document.getElementById('signupMsg');

      // ---------- LocalStorage ----------
      const USERS_KEY   = 'reelhub_users';
      const SESSION_KEY = 'reelhub_session';

      function getUsers() {
        try { return JSON.parse(localStorage.getItem(USERS_KEY)) || []; }
        catch (e) { return []; }
      }
      function saveUsers(users) {
        localStorage.setItem(USERS_KEY, JSON.stringify(users));
      }
      function setSession(user) {
        localStorage.setItem(SESSION_KEY, JSON.stringify(user));
      }
      function getSession() {
        try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
        catch (e) { return null; }
      }
      function clearSession() {
        localStorage.removeItem(SESSION_KEY);
      }

      // ---------- Screen switching ----------
      function showAuth() {
        auth.style.display = 'block';
        app.classList.remove('show');
      }
      function showApp() {
        auth.style.display = 'none';
        app.classList.add('show');

        // reset to home
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        const homeBtn = document.querySelector('.nav-item[data-page="home"]');
        if (homeBtn) homeBtn.classList.add('active');
        document.getElementById('content').innerHTML =
          '<div class="page-title">Home Feed</div>';
      }

      // ---------- Password eye toggle ----------
      document.querySelectorAll('.eye').forEach(eye => {
        eye.addEventListener('click', () => {
          const input = document.getElementById(eye.dataset.target);
          input.type = input.type === 'password' ? 'text' : 'password';
        });
      });

      // ---------- Login <-> Signup switch ----------
      document.getElementById('goSignup').addEventListener('click', () => {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
        loginMsg.textContent = '';
        signupMsg.textContent = '';
      });
      document.getElementById('goLogin').addEventListener('click', () => {
        signupForm.style.display = 'none';
        loginForm.style.display = 'block';
        loginMsg.textContent = '';
        signupMsg.textContent = '';
      });

      // ---------- Signup ----------
      signupForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name  = document.getElementById('signupName').value.trim();
        const user  = document.getElementById('signupUser').value.trim().toLowerCase();
        const email = document.getElementById('signupEmail').value.trim().toLowerCase();
        const pass  = document.getElementById('signupPass').value;

        signupMsg.className = 'error-msg';
        signupMsg.textContent = '';

        if (!name || !user || !email || !pass) {
          signupMsg.textContent = 'Please fill all fields.';
          return;
        }
        if (!/^[a-z0-9._]{3,20}$/.test(user)) {
          signupMsg.textContent = 'Username: 3-20 chars, a-z, 0-9, . or _';
          return;
        }
        if (!/^\S+@\S+\.\S+$/.test(email)) {
          signupMsg.textContent = 'Please enter a valid email.';
          return;
        }
        if (pass.length < 6) {
          signupMsg.textContent = 'Password must be at least 6 characters.';
          return;
        }

        const users = getUsers();
        if (users.some(u => u.user === user)) {
          signupMsg.textContent = 'Username already taken.';
          return;
        }
        if (users.some(u => u.email === email)) {
          signupMsg.textContent = 'Email already registered.';
          return;
        }

        users.push({ name, user, email, pass });
        saveUsers(users);

        signupMsg.className = 'success-msg';
        signupMsg.textContent = 'Account created! Logging in...';

        setTimeout(() => {
          setSession({ name, user, email });
          showApp();
        }, 800);
      });

      // ---------- Login ----------
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const id   = document.getElementById('loginUser').value.trim().toLowerCase();
        const pass = document.getElementById('loginPass').value;

        loginMsg.className = 'error-msg';
        loginMsg.textContent = '';

        if (!id || !pass) {
          loginMsg.textContent = 'Please enter username/email and password.';
          return;
        }

        const users = getUsers();
        const found = users.find(u =>
          (u.user === id || u.email === id) && u.pass === pass
        );

        if (!found) {
          loginMsg.textContent = 'Invalid credentials. Please try again.';
          return;
        }

        setSession({ name: found.name, user: found.user, email: found.email });
        loginMsg.className = 'success-msg';
        loginMsg.textContent = 'Welcome back!';
        setTimeout(showApp, 500);
      });

      // ---------- Forgot password ----------
      document.getElementById('forgotLink').addEventListener('click', () => {
        alert('Forgot password feature will be added soon.');
      });

      // ---------- Logout ----------
      document.getElementById('logoutBtn').addEventListener('click', () => {
        if (confirm('Log out of ReelHub?')) {
          clearSession();
          loginForm.reset();
          signupForm.reset();
          document.getElementById('goLogin').click();
          showAuth();
        }
      });

      // ---------- Page titles ----------
      const pages = {
        home:     'Home Feed',
        shorts:   'Shorts',
        upload:   'Upload',
        messages: 'Messages',
        profile:  'Profile'
      };

      // ---------- Bottom nav (regular items) ----------
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          document.getElementById('content').innerHTML =
            `<div class="page-title">${pages[item.dataset.page]}</div>`;
        });
      });

      // ---------- Center Upload button ----------
      document.querySelector('.upload-btn').addEventListener('click', () => {
        document.getElementById('content').innerHTML =
          `<div class="page-title">${pages.upload}</div>`;
      });

      // ---------- Auto-login ----------
      if (getSession()) {
        showApp();
      } else {
        showAuth();
      }
    })();
  </script>

</body>
</html>
