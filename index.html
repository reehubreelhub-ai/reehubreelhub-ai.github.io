<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelHub</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    /* ---------- SPLASH SCREEN ---------- */
    .splash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .splash img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ---------- MAIN APP ---------- */
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #app.show {
      opacity: 1;
    }

    #app h1 {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ff2e63, #ff8a00);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #app p {
      font-size: 15px;
      color: #888;
      max-width: 320px;
      line-height: 1.5;
    }

    .loader {
      margin-top: 12px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ff2e63;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <!-- ========== SPLASH SCREEN ========== -->
  <div class="splash" id="splash">
    <img src="reelhub-logo.jpg" alt="ReelHub">
  </div>

  <!-- ========== MAIN APP ========== -->
  <div id="app">
    <h1>ReelHub</h1>
    <p>Short videos. Big vibes. 🎬</p>
    <div class="loader"></div>
  </div>

  <script>
    (function () {
      const SPLASH_DURATION = 1000; // splash kitni der dikhe (ms)

      const splash = document.getElementById('splash');
      const app    = document.getElementById('app');

      function showApp() {
        splash.classList.add('hide');
        setTimeout(() => splash.remove(), 600); // fade ke baad DOM se hatao
        app.classList.add('show');
      }

      const img = splash.querySelector('img');

      if (img && !img.complete) {
        img.addEventListener('load', () => {
          setTimeout(showApp, SPLASH_DURATION);
        });
        img.addEventListener('error', () => {
          console.warn('reelhub-logo.jpg load nahi hui.');
          setTimeout(showApp, SPLASH_DURATION);
        });
      } else {
        setTimeout(showApp, SPLASH_DURATION);
      }
    })();
  </script>

</body>
</html>
