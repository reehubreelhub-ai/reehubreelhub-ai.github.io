<!-- ==========================================
     1. LOADING SCREEN (Fixed & Perfect)
     ========================================== -->
<div id="loadingScreen" style="position: fixed; inset: 0; background: radial-gradient(circle at center, #2a0a12 0%, #0a0a0f 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999;">
  
  <!-- Top Right Contact Us Button -->
  <button style="position: absolute; top: 20px; right: 20px; background: linear-gradient(90deg, #6b46c1, #805ad5); color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(107, 70, 193, 0.4);">
    CONTACT US
  </button>

  <!-- Center Logo -->
  <div style="width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(#0a0a0f, #0a0a0f) padding-box, linear-gradient(135deg, #ff8a00, #ff2e63) border-box; border: 4px solid transparent; display: flex; align-items: center; justify-content: center; margin-bottom: 30px; box-shadow: 0 0 30px rgba(255, 46, 99, 0.3);">
    <span style="font-size: 45px; font-weight: 900; color: white;">R</span>
  </div>

  <!-- Welcome Text -->
  <div style="text-align: center; font-size: 32px; font-weight: 800; line-height: 1.2; margin-bottom: 20px; color: #ff2e63;">
    Welcome To<br>
    <span style="background: -webkit-linear-gradient(0deg, #ff8a00, #ff2e63); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: block; font-size: 36px;">ReelHub</span>
  </div>

  <!-- Loading Box -->
  <div style="background: #1e1e24; padding: 12px 30px; border-radius: 8px; margin-bottom: 20px;">
    <span style="color: #ff2e63; font-weight: 600; font-size: 16px;">Loading ....</span>
  </div>

  <!-- Progress Bar Line -->
  <div style="width: 200px; height: 2px; background: #333; border-radius: 2px; overflow: hidden;">
    <div style="width: 50%; height: 100%; background: #ff2e63; animation: loadBar 2s infinite ease-in-out;"></div>
  </div>
  
  <style>
    @keyframes loadBar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
  </style>

  <!-- Bottom Text -->
  <div style="position: absolute; bottom: 40px; text-align: center; color: #ff2e63; font-weight: 900; font-size: 18px; line-height: 1.3;">
    From<br>Reelhub
  </div>
</div>
