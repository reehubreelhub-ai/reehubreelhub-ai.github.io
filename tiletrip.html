<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>ReelHub Tile Trip</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ff2e63'/><text x='50' y='55' font-size='60' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle' dominant-baseline='middle'>R</text></svg>">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}

#game{display:flex;flex-direction:column;height:100vh;padding:10px;gap:10px;max-width:500px;margin:0 auto}

/* Top Bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0f0f16;border:1px solid #1e1e28;border-radius:14px;flex-shrink:0}
.back-btn{background:none;border:none;color:#fff;cursor:pointer;padding:6px;display:flex;align-items:center;gap:6px;font-family:inherit;font-size:13px;font-weight:600}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.stats{display:flex;gap:16px;align-items:center}
.stat-item{text-align:center}
.stat-label{font-size:9px;color:#888;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.stat-value{font-size:16px;font-weight:900;color:#fff;line-height:1}
.stat-value.highlight{background:linear-gradient(90deg,#ff2e63,#ff8a00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* Board */
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:4px;position:relative}
#board{display:grid;gap:4px;background:#121212;padding:10px;border-radius:16px;border:1px solid #1e1e28;width:100%;max-width:400px;margin:0 auto;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.tile{aspect-ratio:1;border-radius:8px;background:linear-gradient(145deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:transform .12s,box-shadow .12s;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.15)}
.tile:active{transform:scale(.92)}
.tile.selected{transform:scale(.88);box-shadow:0 0 0 3px #fff,inset 0 -3px 0 rgba(0,0,0,.3)}
.tile.matched{animation:matchPop .35s ease forwards;pointer-events:none}
@keyframes matchPop{0%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:1}100%{transform:scale(0);opacity:0}}
.tile.empty{background:#0a0a0a;box-shadow:none;cursor:default;pointer-events:none}
.tile.hint{animation:hintPulse 1s infinite}
@keyframes hintPulse{0%,100%{box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}50%{box-shadow:0 0 0 3px #fbbf24,inset 0 -3px 0 rgba(0,0,0,.3)}}

/* Tray (bottom holding slots) */
.tray{background:#0f0f16;border:1px solid #1e1e28;border-radius:14px;padding:10px;flex-shrink:0;display:flex;justify-content:center;gap:6px;min-height:70px;align-items:center}
.tray-slot{width:46px;height:46px;border-radius:8px;background:#0a0a0a;border:2px dashed #262636;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .15s}
.tray-slot.filled{border-style:solid;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}

/* Bottom actions */
.actions{display:flex;gap:8px;flex-shrink:0}
.action-btn{flex:1;height:48px;border-radius:12px;border:1px solid #333;background:#1e1e28;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.action-btn:active{transform:scale(.96);background:#2a2a34}
.action-btn.primary{background:linear-gradient(90deg,#ff2e63,#ff8a00);border:none;box-shadow:0 4px 16px rgba(255,46,99,.35)}
.action-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.action-btn:disabled{opacity:.4;cursor:not-allowed}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.overlay.show{display:flex}
.overlay-box{background:#14141c;border:1px solid #232332;border-radius:22px;padding:30px 24px;max-width:400px;width:100%;text-align:center;animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.overlay-icon{font-size:56px;margin-bottom:14px}
.overlay-box h2{font-size:24px;font-weight:900;background:linear-gradient(90deg,#ff2e63,#ff8a00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.overlay-box p{font-size:13px;color:#888;line-height:1.6;margin-bottom:20px}
.overlay-stats{display:flex;justify-content:center;gap:24px;margin-bottom:22px}
.overlay-stat{text-align:center}
.overlay-stat b{display:block;font-size:24px;font-weight:900;color:#fff}
.overlay-stat span{font-size:11px;color:#888;font-weight:600}
.overlay-buttons{display:flex;flex-direction:column;gap:10px}
.overlay-btn{height:50px;border-radius:12px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.overlay-btn.primary{background:linear-gradient(90deg,#ff2e63,#ff8a00);color:#fff;box-shadow:0 6px 20px rgba(255,46,99,.35)}
.overlay-btn.secondary{background:#1e1e28;color:#ccc;border:1px solid #333}
.overlay-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}

#toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e1e28;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:10000;box-shadow:0 8px 24px rgba(0,0,0,.7);border:1px solid #333;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.combo-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:48px;font-weight:900;color:#ffd700;text-shadow:0 4px 20px rgba(255,215,0,.6);z-index:9998;pointer-events:none;animation:comboAnim .8s ease forwards}
@keyframes comboAnim{0%{transform:translate(-50%,-50%) scale(0);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}70%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-100%) scale(1);opacity:0}}

@media(max-width:380px){
  .tile{font-size:18px}
  .tray-slot{width:40px;height:40px;font-size:16px}
  .stat-value{font-size:14px}
}
</style>
</head>
<body>

<div id="game">

  <!-- Top Bar -->
  <div class="topbar">
    <button class="back-btn" onclick="window.location.href='index.html'">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-label">Level</div>
        <div class="stat-value highlight" id="levelValue">1</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="scoreValue">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Tiles</div>
        <div class="stat-value" id="tilesLeft">0</div>
      </div>
    </div>
  </div>

  <!-- Board -->
  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <!-- Tray (7 slots) -->
  <div class="tray" id="tray">
    <div class="tray-slot" data-slot="0"></div>
    <div class="tray-slot" data-slot="1"></div>
    <div class="tray-slot" data-slot="2"></div>
    <div class="tray-slot" data-slot="3"></div>
    <div class="tray-slot" data-slot="4"></div>
    <div class="tray-slot" data-slot="5"></div>
    <div class="tray-slot" data-slot="6"></div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="action-btn" id="shuffleBtn">
      <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      Shuffle
    </button>
    <button class="action-btn primary" id="hintBtn">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      Hint
    </button>
    <button class="action-btn" id="restartBtn">
      <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      Restart
    </button>
  </div>

</div>

<!-- Overlay: Level Complete -->
<div class="overlay" id="levelOverlay">
  <div class="overlay-box">
    <div class="overlay-icon">🎉</div>
    <h2>Level Complete!</h2>
    <p>Great job! Next level unlocked.</p>
    <div class="overlay-stats">
      <div class="overlay-stat"><b id="finalScore">0</b><span>SCORE</span></div>
      <div class="overlay-stat"><b id="finalLevel">1</b><span>LEVEL</span></div>
    </div>
    <div class="overlay-buttons">
      <button class="overlay-btn primary" id="nextLevelBtn">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        Next Level
      </button>
      <button class="overlay-btn secondary" onclick="window.location.href='index.html'">Back to ReelHub</button>
    </div>
  </div>
</div>

<!-- Overlay: Game Over -->
<div class="overlay" id="gameOverOverlay">
  <div class="overlay-box">
    <div class="overlay-icon">😢</div>
    <h2>Game Over</h2>
    <p id="gameOverMsg">No more moves possible</p>
    <div class="overlay-stats">
      <div class="overlay-stat"><b id="gameOverScore">0</b><span>SCORE</span></div>
      <div class="overlay-stat"><b id="gameOverLevel">1</b><span>LEVEL</span></div>
    </div>
    <div class="overlay-buttons">
      <button class="overlay-btn primary" id="retryBtn">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Try Again
      </button>
      <button class="overlay-btn secondary" onclick="window.location.href='index.html'">Back to ReelHub</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   ReelHub Tile Trip — Match 3 Tile Puzzle
   ============================================================ */

const TILE_TYPES = [
  { emoji: '🍎', c1: '#ff2e63', c2: '#b81e45' },
  { emoji: '🍋', c1: '#fbbf24', c2: '#c9970d' },
  { emoji: '🫐', c1: '#4ea8ff', c2: '#2a6fb8' },
  { emoji: '🥝', c1: '#4ade80', c2: '#2a9d5c' },
  { emoji: '🍇', c1: '#a78bfa', c2: '#7c5dd6' },
  { emoji: '🍑', c1: '#f472b6', c2: '#c94a8a' },
  { emoji: '🥥', c1: '#22d3ee', c2: '#0891b2' },
  { emoji: '🍒', c1: '#ef4444', c2: '#991b1b' },
  { emoji: '🍊', c1: '#fb923c', c2: '#c2410c' },
  { emoji: '🫒', c1: '#84cc16', c2: '#4d7c0f' }
];

const GRID_SIZES = { 1: 4, 2: 4, 3: 5, 4: 5, 5: 6 };

/* ============================================================
   STATE
   ============================================================ */
let board = [];               // grid data: null or tile object
let gridSize = 4;
let level = 1;
let score = 0;
let selectedTile = null;      // { row, col }
let traySlots = [];           // 7 slots: null or tile object
let isAnimating = false;
let hintTimer = null;

/* ============================================================
   INIT
   ============================================================ */
function initGame(startLevel) {
  level = startLevel || 1;
  score = 0;
  selectedTile = null;
  traySlots = Array(7).fill(null);
  isAnimating = false;

  gridSize = GRID_SIZES[level] || 6;

  // Build board with only tile types needed
  const numTypes = Math.min(3 + Math.floor(level / 2), 6);
  const types = TILE_TYPES.slice(0, numTypes);

  board = [];
  const totalTiles = gridSize * gridSize;

  // Ensure total tiles divisible by 3 for perfect matching
  const tilesPerType = Math.floor(totalTiles / (numTypes * 3)) * 3;
  const pool = [];

  for (let t = 0; t < numTypes; t++) {
    for (let i = 0; i < tilesPerType; i++) {
      pool.push(types[t]);
    }
  }

  // Fill remaining with random types (multiples of 3)
  while (pool.length < totalTiles) {
    const t = types[Math.floor(Math.random() * types.length)];
    // Add 3 at a time
    for (let i = 0; i < 3 && pool.length < totalTiles; i++) pool.push(t);
  }

  // Trim if over
  while (pool.length > totalTiles) pool.pop();

  // Shuffle
  shuffleArray(pool);

  for (let r = 0; r < gridSize; r++) {
    board[r] = [];
    for (let c = 0; c < gridSize; c++) {
      board[r][c] = pool[r * gridSize + c];
    }
  }

  renderBoard();
  renderTray();
  updateStats();
  clearHint();

  // Auto-hint after 8 seconds of inactivity
  scheduleHint();
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function renderBoard() {
  const boardEl = document.getElementById('board');
  boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
  boardEl.innerHTML = '';

  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const tile = board[r][c];
      const el = document.createElement('div');

      if (tile) {
        el.className = 'tile';
        el.textContent = tile.emoji;
        el.style.setProperty('--c1', tile.c1);
        el.style.setProperty('--c2', tile.c2);
        el.dataset.row = r;
        el.dataset.col = c;
        el.addEventListener('click', () => onTileClick(r, c, el));

        if (selectedTile && selectedTile.row === r && selectedTile.col === c) {
          el.classList.add('selected');
        }
      } else {
        el.className = 'tile empty';
        el.dataset.row = r;
        el.dataset.col = c;
      }

      boardEl.appendChild(el);
    }
  }
}

function renderTray() {
  for (let i = 0; i < 7; i++) {
    const slot = document.querySelector(`.tray-slot[data-slot="${i}"]`);
    const tile = traySlots[i];
    slot.innerHTML = '';
    slot.classList.remove('filled');

    if (tile) {
      slot.textContent = tile.emoji;
      slot.classList.add('filled');
      slot.style.setProperty('--c1', tile.c1);
      slot.style.setProperty('--c2', tile.c2);
    } else {
      slot.style.removeProperty('--c1');
      slot.style.removeProperty('--c2');
    }
  }
}

function updateStats() {
  document.getElementById('levelValue').textContent = level;
  document.getElementById('scoreValue').textContent = score;

  let count = 0;
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      if (board[r][c]) count++;
    }
  }
  document.getElementById('tilesLeft').textContent = count;
}

/* ============================================================
   TILE CLICK — Move to tray
   ============================================================ */
function onTileClick(row, col, el) {
  if (isAnimating) return;
  clearHint();

  const tile = board[row][col];
  if (!tile) return;

  // Find first empty tray slot
  const emptyIdx = traySlots.findIndex(t => t === null);
  if (emptyIdx === -1) {
    showToast('⚠️ Tray full! Match 3 to clear.');
    return;
  }

  // Vibration feedback
  if (navigator.vibrate) navigator.vibrate(15);

  // Remove from board
  board[row][col] = null;
  el.classList.add('matched');
  setTimeout(() => renderBoard(), 350);

  // Add to tray
  traySlots[emptyIdx] = tile;
  renderTray();
  updateStats();

  // Check for match of 3
  setTimeout(() => checkTrayMatch(), 100);
}

/* ============================================================
   TRAY MATCH CHECK
   ============================================================ */
function checkTrayMatch() {
  // Count occurrences of each tile type
  const counts = {};
  traySlots.forEach((t, i) => {
    if (!t) return;
    const key = t.emoji;
    if (!counts[key]) counts[key] = [];
    counts[key].push(i);
  });

  // Find a set of 3 identical tiles
  for (const key in counts) {
    if (counts[key].length >= 3) {
      const indices = counts[key].slice(0, 3);
      matchTrayTiles(indices, key);
      return;
    }
  }

  // Check game over: tray full and no match possible
  if (traySlots.every(t => t !== null)) {
    setTimeout(() => gameOver(), 500);
  }
}

function matchTrayTiles(indices, emoji) {
  isAnimating = true;

  // Score
  const points = 30 + level * 5;
  score += points;

  // Show combo text
  showCombo('+ ' + points);

  if (navigator.vibrate) navigator.vibrate([30, 30, 30]);

  // Clear slots
  indices.forEach(i => {
    traySlots[i] = null;
  });

  renderTray();
  updateStats();

  // After clearing, re-check for another match
  setTimeout(() => {
    isAnimating = false;
    checkTrayMatch();

    // Check level complete
    const tilesRemaining = board.flat().filter(t => t !== null).length;
    const trayFull = traySlots.filter(t => t !== null).length;
    if (tilesRemaining === 0 && trayFull === 0) {
      setTimeout(() => levelComplete(), 400);
    }
  }, 300);
}

/* ============================================================
   LEVEL / GAME OVER
   ============================================================ */
function levelComplete() {
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalLevel').textContent = level;
  document.getElementById('levelOverlay').classList.add('show');
  if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
}

function gameOver() {
  document.getElementById('gameOverScore').textContent = score;
  document.getElementById('gameOverLevel').textContent = level;
  document.getElementById('gameOverOverlay').classList.add('show');
  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
}

document.getElementById('nextLevelBtn').addEventListener('click', () => {
  document.getElementById('levelOverlay').classList.remove('show');
  initGame(level + 1);
});

document.getElementById('retryBtn').addEventListener('click', () => {
  document.getElementById('gameOverOverlay').classList.remove('show');
  initGame(level);
});

/* ============================================================
   SHUFFLE
   ============================================================ */
document.getElementById('shuffleBtn').addEventListener('click', () => {
  // Collect all remaining tiles from board
  const tiles = [];
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      if (board[r][c]) tiles.push(board[r][c]);
    }
  }

  // Add tray tiles back? No — keep them. Just shuffle board.
  shuffleArray(tiles);

  // Put back
  let idx = 0;
  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      if (board[r][c]) {
        board[r][c] = tiles[idx++];
      }
    }
  }

  renderBoard();
  showToast('🔀 Shuffled!');
  clearHint();
  scheduleHint();
});

/* ============================================================
   HINT
   ============================================================ */
document.getElementById('hintBtn').addEventListener('click', () => {
  findHint(true);
});

function scheduleHint() {
  clearHint();
  hintTimer = setTimeout(() => findHint(false), 8000);
}

function clearHint() {
  if (hintTimer) {
    clearTimeout(hintTimer);
    hintTimer = null;
  }
  document.querySelectorAll('.tile.hint').forEach(t => t.classList.remove('hint'));
}

function findHint(showToastMsg) {
  clearHint();

  // Check tray first — if 2 same tiles exist, find a 3rd on board
  const trayCounts = {};
  traySlots.forEach(t => {
    if (!t) return;
    trayCounts[t.emoji] = (trayCounts[t.emoji] || 0) + 1;
  });

  let hintTile = null;

  // Priority 1: A tile on board that completes a tray set
  for (const emoji in trayCounts) {
    if (trayCounts[emoji] === 2) {
      // Find this emoji on board
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (board[r][c] && board[r][c].emoji === emoji) {
            hintTile = { row: r, col: c };
            break;
          }
        }
        if (hintTile) break;
      }
      if (hintTile) break;
    }
  }

  // Priority 2: Any 3 of a kind on board
  if (!hintTile) {
    const boardCounts = {};
    for (let r = 0; r < gridSize; r++) {
      for (let c = 0; c < gridSize; c++) {
        if (!board[r][c]) continue;
        const key = board[r][c].emoji;
        if (!boardCounts[key]) boardCounts[key] = [];
        boardCounts[key].push({ row: r, col: c });
      }
    }
    for (const key in boardCounts) {
      if (boardCounts[key].length >= 3) {
        hintTile = boardCounts[key][0];
        break;
      }
    }
  }

  if (hintTile) {
    const el = document.querySelector(`.tile[data-row="${hintTile.row}"][data-col="${hintTile.col}"]`);
    if (el) el.classList.add('hint');
    if (showToastMsg) showToast('💡 Hint: Try this tile');
  } else {
    if (showToastMsg) showToast('⚠️ No match available');
  }

  scheduleHint();
}

/* ============================================================
   RESTART
   ============================================================ */
document.getElementById('restartBtn').addEventListener('click', () => {
  if (!confirm('Restart this level?')) return;
  initGame(level);
});

/* ============================================================
   HELPERS
   ============================================================ */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('show'), 1800);
}

function showCombo(text) {
  const el = document.createElement('div');
  el.className = 'combo-text';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}
